[package]
name = "sparko_graphql"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["sparko_graphql_derive", "sparko_graphql_core", "sparko_graphql_builder", "sparko_graphql_builder_test"]

[dev-dependencies]
trybuild = "1.0"

[dependencies]
display_json = "0.2.1"
once_cell = "1.19.0"
reqwest = { version = "0.12.7", features = ["json"] }
serde = { version = "1.0.210", features = ["derive"]}
serde_json = "1.0.128"
time = { version = "0.3.36", features = ["serde", "parsing", "formatting"] }
sparko_graphql_derive = {path = "sparko_graphql_derive" }
